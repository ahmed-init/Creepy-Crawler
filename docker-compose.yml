services:

  redis:
    image: redis:latest
    container_name: crawler-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: .
    container_name: crawler-backend
    ports:
      - "8080:8080"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped